apiVersion: apps/v1
kind: Deployment
metadata:
  name: activecollab-mcp-server
  namespace: activecollab
  labels:
    app: activecollab-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activecollab-mcp-server
  template:
    metadata:
      labels:
        app: activecollab-mcp-server
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/your-username/activecollab-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: MCP_TRANSPORT
              value: "sse"
            - name: PORT
              value: "3000"
            - name: ACTIVECOLLAB_URL
              value: "https://app.activecollab.com/YOUR_ACCOUNT_ID"
            - name: ACTIVECOLLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: activecollab-mcp-secret
                  key: token
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: activecollab-mcp-server
  namespace: activecollab
  labels:
    app: activecollab-mcp-server
spec:
  selector:
    app: activecollab-mcp-server
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: v1
kind: Secret
metadata:
  name: activecollab-mcp-secret
  namespace: activecollab
type: Opaque
stringData:
  token: "YOUR_USER_ID-YOUR_TOKEN_STRING"
